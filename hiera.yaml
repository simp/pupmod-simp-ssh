---
version: 5
defaults:
  datadir: 'data'
  data_hash: 'yaml_data'
hierarchy:
  - name: 'OS name and major release'
    path: 'os/%{facts.os.name}-%{facts.os.release.major}.yaml'
  - name: 'OS name'
    path: 'os/%{facts.os.name}.yaml'
  - name: 'OS family and major release'
    path: 'os/%{facts.os.family}-%{facts.os.release.major}.yaml'
  - name: 'OS family'
    path: 'os/%{facts.os.family}.yaml'
  - name: 'Common'
    path: 'common.yaml'
